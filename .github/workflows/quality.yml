name: Quality

# The gate for every change: pinned install, deterministic build, boundary assertions,
# and proof that the committed main.js / styles.css are what the source produces.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # the job only reads the repository: do not leave the token in .git/config
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      # no install scripts: the build needs none (esbuild runs from its platform package)
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run verify
